name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify
        env:
          # Unit tests intentionally exercise the GitHub Actions log helpers.
          # Keep the raw output visible, but do not let test fixtures create
          # misleading annotations on a successful CI run.
          ENTRA_DISABLE_GITHUB_ACTIONS_COMMANDS: "true"
        run: pnpm verify

  container:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: entra-credential-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime
        run: |
          uid="$(docker run --rm --entrypoint /usr/bin/node entra-credential-monitor:ci -e "process.stdout.write(String(process.getuid?.() ?? -1))")"
          test "$uid" != "0"

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: entra-credential-monitor:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
